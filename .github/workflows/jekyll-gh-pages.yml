name: Build and deploy to GitHub Pages

# Repo layout this workflow expects:
#
#   .github/workflows/jekyll-gh-pages.yml   <- this file (must be at repo root)
#   docs/                                    <- the Jekyll site
#     _config.yml
#     Gemfile
#     _layouts/ _includes/ assets/ ...
#
# Everything below runs inside docs/. If you move the site, change SITE_DIR
# and nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bundler-cache needs to find the Gemfile, which lives in docs/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.SITE_DIR }}

      - uses: actions/configure-pages@v5
        id: pages

      # Reads `qgds.source` from _config.yml:
      #   source -> build the component library from its repo and vendor it
      #   local  -> vendor the pinned npm version
      #   cdn    -> nothing to do
      - name: Vendor QGDS web components
        working-directory: ${{ env.SITE_DIR }}
        run: |
          if grep -qE '^[[:space:]]+source:[[:space:]]*source' _config.yml; then
            REF="$(grep -E '^[[:space:]]+source_ref:' _config.yml | head -1 | awk '{print $2}')"
            bash ./scripts/vendor-qgds.sh --from-source "${REF:-main}"
          elif grep -qE '^[[:space:]]+source:[[:space:]]*local' _config.yml; then
            bash ./scripts/vendor-qgds.sh
          else
            echo "qgds.source is 'cdn' — nothing to vendor."
          fi

      - name: Build
        working-directory: ${{ env.SITE_DIR }}
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --destination "${{ github.workspace }}/_site" \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Check for broken build
        run: |
          test -f "${{ github.workspace }}/_site/index.html" \
            || { echo "::error::No index.html was produced — check the Jekyll log above."; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
